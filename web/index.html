<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description"
    content="Md. Sifatullah — Software Engineer specialising in Flutter, mobile and full-stack development. Portfolio, projects and CV.">
  <meta name="theme-color" content="#0f0d1a">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Md. Sifatullah">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="flutter_bootstrap.js" as="script">

  <title>Md. Sifatullah 👋 | Software Engineer</title>

  <style>
    #boot {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0f0d1a; color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .4s ease;
    }
    #boot h1 { margin: 0 0 1.1rem; font-size: 1.05rem; font-weight: 600; letter-spacing: .02em; text-align: center; padding: 0 1rem; }
    #boot .sp {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, .18); border-top-color: #7c4dff;
      animation: boot-sp 1s linear infinite;
    }
    @keyframes boot-sp { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot">
    <h1>Md. Sifatullah — Software Engineer</h1>
    <div class="sp"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Drop the boot splash as soon as the Flutter view mounts.
    new MutationObserver(function (_, obs) {
      if (document.querySelector('flutter-view, flt-glass-pane')) {
        var b = document.getElementById('boot');
        if (b) { b.style.opacity = '0'; setTimeout(function () { b.remove(); }, 400); }
        obs.disconnect();
      }
    }).observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
