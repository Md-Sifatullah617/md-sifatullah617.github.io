name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, don't cancel in-progress production runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          CI: true
          # Set repo variable REACT_APP_SPLITFORMS_ACCESS_KEY to wire up the contact form.
          REACT_APP_SPLITFORMS_ACCESS_KEY: ${{ vars.REACT_APP_SPLITFORMS_ACCESS_KEY }}

      - name: Verify CNAME survived the build
        run: |
          test "$(cat build/CNAME)" = "sifatullah.me" || {
            echo "::error::build/CNAME missing or wrong"; exit 1;
          }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
