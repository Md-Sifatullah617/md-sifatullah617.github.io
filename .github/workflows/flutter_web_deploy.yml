name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: ["**"] # any branch
    paths:
      - "lib/**"
      - "web/**"
      - "pubspec.yaml"
      - ".github/workflows/flutter_web_deploy.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Force deploy (ignore keyword)"
        required: false
        default: "false"

permissions:
  contents: write # needed for gh-pages push
  pages: write
  id-token: write

env:
  CHANNEL: "stable" # use latest stable Flutter
  DEPLOY_KEYWORD: "[deploy-web]" # commit message must contain this to auto deploy

jobs:
  build-and-deploy:
    # Only run if commit message contains keyword or manual dispatch
    if: >-
      (github.event_name == 'push' && github.event.head_commit.message != '' &&
       contains(github.event.head_commit.message, '[deploy-web]')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.CHANNEL }}
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Show Flutter version
        run: flutter --version

      - name: Read pubspec package name
        id: pkg
        run: |
          PKG_NAME=$(grep '^name:' pubspec.yaml | head -1 | cut -d':' -f2 | tr -d " '""\t")
          echo "Package name: $PKG_NAME"
          if [ -z "$PKG_NAME" ]; then echo "Could not determine package name"; exit 1; fi
          echo "package_name=$PKG_NAME" >> $GITHUB_OUTPUT

      - name: Build web
        # Use pubspec name for base href (requested). NOTE: If repo name differs, ensure Pages path matches.
        run: |
          echo "Building with base href: /"
          flutter build web --wasm --release --base-href "/"

      - name: Fix leading slash asset path (flutter_inappwebview script)
        run: |
          INDEX="build/web/index.html"
          if grep -q 'src="/assets/packages/flutter_inappwebview_web' "$INDEX"; then
            sed -i 's#src="/assets/#src="assets/#' "$INDEX"
          fi
          grep -n 'web_support.js' "$INDEX" || true

      - name: Add .nojekyll
        run: touch build/web/.nojekyll

      - name: Deploy to main
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: main
          folder: build/web
          clean: true
          commit-message: "Deploy: ${GITHUB_SHA}"
          single-commit: true

      - name: Post-deploy info
        run: |
          echo "Deployed to: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "Base href used: /${{ steps.pkg.outputs.package_name }}/"
          echo "Trigger: ${{ github.event_name }}"
          echo "Keyword required: ${DEPLOY_KEYWORD} (present = ${{ github.event_name == 'push' && contains(github.event.head_commit.message, env.DEPLOY_KEYWORD) }})"
